<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course | NeuralSyntax</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#0f172a] text-white">
    <header class="flex items-center justify-between px-8 py-4 bg-[#111827] shadow-lg border-b border-[#1f2937]">

  <!-- Logo -->
  <div class="flex items-center">
    <img src="assets/images/wmremove-transformed.jpeg" 
         class="w-12 h-12 rounded-full object-cover mr-3">

    <h1 class="text-2xl md:text-3xl font-bold tracking-tight">
      Neural
      <span class="text-[#22c1f1] drop-shadow-[0_0_8px_#22c1f1]">
        Syntax
      </span>
    </h1>
  </div>

  <!-- Nav -->
  <nav class="flex items-center gap-8 text-sm font-semibold">

    <a href="index.html"
       class="text-[#9ca3af] hover:text-[#22c1f1] transition relative group">
      Home
      <span class="absolute left-0 -bottom-1 w-0 h-[2px] bg-[#22c1f1] transition-all duration-300 group-hover:w-full"></span>
    </a>

    <a href="courses.html"
       class="text-[#22c1f1] relative group"> <!-- active page -->
      Courses
      <span class="absolute left-0 -bottom-1 w-full h-[2px] bg-[#22c1f1]"></span>
    </a>

    <a href="blog.html"
       class="text-[#9ca3af] hover:text-[#22c1f1] transition relative group">
      Blog
      <span class="absolute left-0 -bottom-1 w-0 h-[2px] bg-[#22c1f1] transition-all duration-300 group-hover:w-full"></span>
    </a>

  </nav>

</header>

<!-- Page Container -->
<div class="p-6">

  <!-- Layout -->
  <div class="grid md:grid-cols-3 gap-6">

    <!-- Left: Player -->
    <div class="md:col-span-2 space-y-4">

      <!-- Video Player -->
      <iframe 
        id="player"
        class="w-full h-[400px] rounded-xl"
        src=""
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>

      <!-- Controls -->
      <div>
        <button onclick="nextVideo()" 
          class="bg-[#22c1f1] text-black px-4 py-2 rounded hover:bg-[#0ea5e9] transition">
          Next ▶
        </button>
      </div>

    </div>

    <!-- Right: Video List -->
    <div id="videos" 
         class="space-y-4 overflow-y-auto max-h-[450px] pr-2">
    </div>

  </div>

  <!-- Fallback Message -->
  <p id="error" class="text-red-400 mt-6 text-center hidden">
    Failed to load videos. Check API key or playlist.
  </p>

</div>

<script src="js/coursePage.js"></script>

</body>
</html>
</html>
